<!doctype html>
<html lang="en" data-theme="sepia" data-font="mono" data-anim="chess">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To-do</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="fx" aria-hidden="true"></div>

  <header class="top">
    <nav class="crumbs" id="crumbs"></nav>
    <div class="tools">
      <button id="progressBtn" class="tool" title="Progress calendar">Progress</button>
      <button id="pinBtn" class="tool" title="Keep on top" hidden>Pin</button>
      <button id="settingsBtn" class="tool" title="Settings">Settings</button>
      <button id="closeBtn" class="tool" title="Close" hidden>✕</button>
    </div>
  </header>

  <main>
    <section id="listView">
      <input id="pageTitle" class="page-title" placeholder="Untitled" hidden>

      <div class="composer">
        <input id="add" class="add" placeholder="New task, Enter to add" autocomplete="off">
        <div class="kind" role="group" aria-label="New item type">
          <button class="active" data-kind="task">Task</button>
          <button data-kind="folder">Folder</button>
        </div>
      </div>

      <ul id="list" class="list"></ul>
      <p id="empty" class="empty" hidden>Nothing here yet.</p>
      <p id="summary" class="summary"></p>
    </section>

    <section id="progressView" class="progress" hidden>
      <div class="progress-head">
        <button id="prevMonth" class="tool" aria-label="Previous month">‹</button>
        <h2 id="monthLabel"></h2>
        <button id="nextMonth" class="tool" aria-label="Next month">›</button>
        <button id="thisMonth" class="tool">Today</button>
      </div>
      <div id="gridWrap" class="grid-wrap">
        <table id="grid" class="grid"></table>
      </div>
      <p id="trackEmpty" class="empty" hidden>No tracked tasks yet. Click ◎ on a task to track it day by day.</p>
    </section>
  </main>

  <section id="settings" class="settings" hidden>
    <label>Theme
      <select id="theme">
        <option value="light">Light</option>
        <option value="dark">Dark</option>
        <option value="sepia">Sepia</option>
        <option value="midnight">Midnight</option>
        <option value="forest">Forest</option>
        <option value="cyberpunk">Cyberpunk</option>
      </select>
    </label>
    <label>Font
      <select id="font">
        <option value="sans">Sans</option>
        <option value="serif">Serif</option>
        <option value="mono">Mono</option>
      </select>
    </label>
    <label>Animation
      <select id="anim">
        <option value="off">Off</option>
        <option value="chess">Chess (smooth)</option>
        <option value="retro">1964 (retro)</option>
        <option value="arcade">Arcade (satisfying)</option>
      </select>
    </label>
    <label>Accent
      <div class="accent-row">
        <input id="accent" type="color">
        <button id="accentReset">Reset</button>
      </div>
    </label>
    <div class="actions">
      <button id="exportBtn">Export</button>
      <label>Import<input id="importFile" type="file" accept="application/json"></label>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
